<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon.ico" type="image/x-icon" />
    <link rel="icon" href="%sveltekit.assets%/apple-touch-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <title>Kalkul</title>
    <meta
      name="description"
      content="Build your financial peace. Get the big picture of your finances in one place and see where they lead."
    />
    <!-- Link preview for chats and social sites, which read this static head
         and never run the app. The absolute URLs are needed by the crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kalkul" />
    <meta property="og:title" content="Kalkul - Build your financial peace" />
    <meta
      property="og:description"
      content="Get the big picture of your finances in one place and see where they lead."
    />
    <meta property="og:url" content="https://kalkul.app/" />
    <meta property="og:image" content="https://kalkul.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="kalkul.app" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
