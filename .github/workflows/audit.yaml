name: Dependency audit

# `pnpm audit` over the whole lockfile, dev dependencies included: the app
# bundles its devDependencies, and a build tool runs beside what is deployed.
# It passes while every reported advisory is on the `auditConfig.ignoreGhsas`
# list in pnpm-workspace.yaml and fails on one that is not, or on a listed one
# that is no longer reported.
#
# Called by deploy-prod.yaml before a production deploy. PR previews are not
# gated. On a pull request it runs only when dependencies change.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/audit.yaml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # No install: the audit reads the lockfile. A registry error fails the
      # job rather than passing it; re-run it.
      - run: pnpm audit

      # The list only shrinks if a fix taken also deletes its entries: audit
      # again without the list and fail on an entry nothing reports. A registry
      # error reports nothing, so it fails here too.
      - name: Every ignored advisory is still reported
        run: |
          block='/^auditConfig:/{on=1;next} /^[^ #]/{on=0}'
          listed=$(awk "$block on" pnpm-workspace.yaml | grep -oE 'GHSA(-[a-z0-9]{4}){3}' | sort -u)
          awk "$block !on" pnpm-workspace.yaml > unlisted.yaml
          mv unlisted.yaml pnpm-workspace.yaml
          reported=$( (pnpm audit --json || true) | jq -r '.advisories[].github_advisory_id' | sort -u)
          stale=$(comm -23 <(echo "$listed") <(echo "$reported"))
          if [ -n "$stale" ]; then
            echo "No longer reported, delete from auditConfig.ignoreGhsas:"
            echo "$stale"
            exit 1
          fi
