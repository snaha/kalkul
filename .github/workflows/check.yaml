name: Check

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the build
        run: pnpm run check

      - name: Code linting
        run: pnpm run lint

      - name: Check localization files
        run: pnpm check-locales

      - name: Check dependencies and unused files
        run: pnpm knip

      - name: Run tests
        run: pnpm test:unit
