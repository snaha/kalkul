name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Analytics is opt-in at build time (#314); kalkul.app is the only build
      # that turns it on. The id is public, it identifies the site, not a secret.
      - name: Build
        run: VITE_UMAMI_WEBSITE_ID=792b102b-b18a-440b-9fce-58639490a4d2 pnpm build

      - name: Copy SPA fallback
        run: cp build/index.html build/404.html

      # Publish the production build to the root of the gh-pages branch, which
      # GitHub Pages serves at kalkul.app. The per-PR preview directories
      # (pr-*) are left untouched.
      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: build
          clean-exclude: pr-*
