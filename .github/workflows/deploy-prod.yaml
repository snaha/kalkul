name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Installs and builds with a read-only token that is not left in the
  # checkout, so no dependency's install or build script can push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Analytics is opt-in at build time (#314); kalkul.app is the only build
      # that turns it on. The id is public, it identifies the site, not a secret.
      - name: Build
        run: VITE_UMAMI_WEBSITE_ID=792b102b-b18a-440b-9fce-58639490a4d2 pnpm build

      - name: Copy SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build
          retention-days: 1

  # Holds the write token and runs no project or dependency code: it only
  # downloads the build and pushes it.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      # Publish the production build to the root of the gh-pages branch, which
      # GitHub Pages serves at kalkul.app. The per-PR preview directories
      # (pr-*) are left untouched.
      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: build
          clean-exclude: pr-*
